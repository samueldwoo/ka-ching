name: Public test suite

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, ubuntu-22.04, windows-2022]
        python: ["3.10", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install tested dependencies
        run: python -m pip install -r requirements-dev.txt -c constraints.txt
      - name: Verify dependency consistency
        run: python -m pip check
      - name: Run public synthetic tests
        run: python -m pytest -q
      - name: Verify non-x64 Windows binary wheels
        if: matrix.os == 'ubuntu-22.04' && matrix.python == '3.14'
        shell: bash
        run: |
          for platform in win32 win_arm64; do
            for version in 310 314; do
              python -m pip download --no-deps --only-binary=:all: \
                --platform "$platform" --python-version "$version" \
                --implementation cp --abi "cp$version" \
                --dest "${{ runner.temp }}/$platform-wheels-$version" \
                -c constraints.txt PyMuPDF lxml
            done
          done
